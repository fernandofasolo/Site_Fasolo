services:
  - type: web
    name: copa2026-api
    runtime: python
    rootDir: copa2026-backend
    buildCommand: pip install -r requirements.txt && python db/init.py
    startCommand: python db/init.py --reset && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /var/data/copa2026.db
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://fasolo.ia.br
    disk:
      name: copa-db
      mountPath: /var/data
      sizeGB: 1
